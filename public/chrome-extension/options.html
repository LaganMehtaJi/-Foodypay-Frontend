<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>FoodyPay Extension Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 480px;
      margin: 24px auto;
      padding: 20px;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
    }
    h2 { margin-top: 0; color: #FF5E14; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 12.5px; font-weight: 700; margin-bottom: 4px; color: #334155; }
    input { width: 100%; padding: 8px 10px; border: 1px solid #CBD5E1; border-radius: 6px; font-size: 13px; box-sizing: border-box; }
    button { background: #FF5E14; color: white; border: none; padding: 9px 18px; border-radius: 6px; font-weight: 700; cursor: pointer; }
    .status { font-size: 12px; color: #10B981; margin-top: 8px; font-weight: 600; }
  </style>
</head>
<body>
  <h2>FoodyPay Chrome Extension Configuration</h2>
  <form id="settingsForm">
    <div class="form-group">
      <label>Backend API Base URL</label>
      <input type="text" id="apiUrl" placeholder="http://localhost:5001/api" />
    </div>
    <div class="form-group">
      <label>Merchant FoodyPay ID</label>
      <input type="text" id="foodypayId" placeholder="FP-985569" />
    </div>
    <div class="form-group">
      <label>POS Dashboard URL</label>
      <input type="text" id="dashboardUrl" placeholder="http://localhost:3000/admin" />
    </div>
    <button type="submit">Save Settings</button>
    <div id="status" class="status"></div>
  </form>

  <script src="options.js"></script>
</body>
</html>
