    if (item.revenue > maxRev) {
      maxRev = item.revenue;
      maxRevHour = item;
    }
    if (item.ordersCount > 0) {
      if (item.hour < minActiveHour) minActiveHour = item.hour;
      if (item.hour > maxActiveHour) maxActiveHour = item.hour;
    }
  });

  // Display hours range (default 9 AM to 11 PM or active hours)
  let displayStart = Math.min(minActiveHour !== 24 ? minActiveHour : 9, 9);
  let displayEnd = Math.max(maxActiveHour !== -1 ? maxActiveHour : 23, 23);
  if (displayStart > 9) displayStart = 9;
  if (displayEnd < 22) displayEnd = 22;

  const cashPct = totalRev ? Math.round((cashRev / totalRev) * 100) : 0;
  const upiPct = totalRev ? Math.round((upiRev / totalRev) * 100) : 0;

      itemMap[name].qty += (+it.qty || 1);
      itemMap[name].total += (+it.qty || 1) * (+it.price || 0);

              <span>Cash ${cashPct}% • UPI ${upiPct}% • Card ${cardPct}%</span>

            <div style="display:flex;height:6px;border-radius:99px;overflow:hidden;margin-top:4px;background:#e2e8f0">

              <div style="width:${upiPct}%;background:#0284c7" title="UPI ${upiPct}%"></div>

function renderMySaleDaySubTab(daySales, itemSummary, colName) {
  if (mySaleDayActiveTab === 'sales') {

        </table>
      </div>
    `;
  }

  if (mySaleDayActiveTab === 'unpaid') {
    const unpaidSales = (S.history || []).filter(h => h.status === 'UNPAID');
    const totalUnpaid = unpaidSales.reduce((sum, h) => sum + (+h.total || 0), 0);
    return `
      <div class="card" style="overflow:auto">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
          <div>
            <h3 style="margin:0;color:#b45309;display:flex;align-items:center;gap:6px">
              <span>⚠️ All Unpaid &amp; Due Orders</span>
              <span style="font-size:12px;background:#f59e0b;color:#fff;padding:2px 8px;border-radius:99px">${unpaidSales.length} orders · ${money(totalUnpaid)}</span>
            </h3>
            <small class="mu">Customer se payment lene par "Collect Money" button dabayein aur Cash/UPI/Card se settle karein</small>
          </div>
          <button class="g" style="padding:8px 14px;font-size:12px;font-weight:700" onclick="openUnpaidOrdersModal()">⚡ Open Full Settle Window</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>Date / Time</th>
              <th>Customer / Table</th>
              <th>Items Detail</th>
              <th class="r">Due Amount</th>
              <th style="text-align:center">Collect Payment</th>
              <th style="text-align:center">Action</th>
            </tr>
          </thead>
          <tbody>
            ${unpaidSales.map(h => {
              const rawId = String(h.id || h.start || '');
              const custName = (h.cust && h.cust.name) ? h.cust.name : (h.del ? h.del.name : (h.table ? 'Table ' + h.table : 'Walk-in'));
              const phone = (h.cust && h.cust.phone) ? h.cust.phone : (h.del ? h.del.phone : '');
              const dateStr = h.end ? new Date(h.end).toLocaleString('en-IN', {dateStyle:'short', timeStyle:'short'}) : '-';
              return `
                <tr>
                  <td>${dateStr}</td>
                  <td>
                    <b>${esc(custName)}</b>
                    ${phone ? `<br><small class="mu">📞 ${esc(phone)}</small>` : ''}
                  </td>
                  <td>${(h.items || []).map(i => `${esc(i.name)} × ${i.qty}`).join(', ') || 'No items'}</td>
                  <td class="r"><b style="color:#d97706;font-size:15px">${money(h.total)}</b></td>
                  <td style="text-align:center">
                    <button class="g" style="padding:7px 14px;font-size:12px;font-weight:700;box-shadow:0 2px 6px rgba(22,163,74,0.3)" onclick="showCollectMoneyModal('${rawId}')">
                      💰 Collect Money
                    </button>
                  </td>
                  <td style="text-align:center">
                    <button style="padding:5px 10px;font-size:11px;font-weight:600;background:#f1f5f9;border:1px solid #cbd5e1;border-radius:6px;cursor:pointer" onclick="viewOldOrder('${rawId}')">
                      🧾 View Bill
                    </button>
                  </td>
                </tr>
              `;
            }).join('') || '<tr><td colspan="6" class="mu" style="text-align:center;padding:28px">🎉 Koi bhi unpaid order pending nahi hai. Sabhi bills paid hain!</td></tr>'}
          </tbody>
        </table>
      </div>
    `;
  }

  if (mySaleDayActiveTab === 'items') {
    return `
      <div class="card" style="overflow:auto">
        <h3 style="margin:0 0 10px">🍔 Dish-wise Breakdown (${esc(mySaleDaySelectedDate)})</h3>
        <table>
          <thead>
            <tr>
              <th>Item Name</th>
              <th class="r">Quantity Sold</th>
              <th class="r">Total Revenue</th>
            </tr>
          </thead>
          <tbody>
            ${itemSummary.map(([name, data]) => `
              <tr>
                <td><b>${esc(name)}</b></td>
                <td class="r">${data.qty} portions</td>
                <td class="r"><b>${money(data.total)}</b></td>
              </tr>
            `).join('') || '<tr><td colspan="3" class="mu" style="text-align:center;padding:20px">No items sold on this day.</td></tr>'}
          </tbody>
        </table>
      </div>
    `;
  }

  if (mySaleDayActiveTab === 'catalog') {
    return `
      <div class="card">
        <div class="row" style="justify-content:space-between;margin-bottom:12px;flex-wrap:wrap">
          <h3 style="margin:0">📦 Catalog Cloud Status</h3>
          <button class="p" onclick="syncCatalogToCloud(true)">Upload Catalog to Cloud Now</button>
        </div>
        <p class="mu" style="margin-top:0">Aapka catalog document <code>${esc(colName)}/catalog</code> me store rehta hai.</p>
        <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:14px">
          <div style="background:var(--blank);padding:10px;border-radius:8px">
            <span class="mu">Total Categories</span>
            <h3 style="margin:4px 0">${(S.cats||[]).length}</h3>
            <small class="mu">${(S.cats||[]).join(', ')}</small>
          </div>
          <div style="background:var(--blank);padding:10px;border-radius:8px">
            <span class="mu">Total Products</span>
            <h3 style="margin:4px 0">${(S.products||[]).length} items</h3>
            <small class="mu">With variants &amp; prices</small>
          </div>
          <div style="background:var(--blank);padding:10px;border-radius:8px">
            <span class="mu">Active Tables/Areas</span>
            <h3 style="margin:4px 0">${(S.areas||[]).length} Areas</h3>
            <small class="mu">${(S.areas||[]).map(a=>a.name).join(', ')}</small>
          </div>
        </div>
      </div>
    `;
  }

  if (mySaleDayActiveTab === 'raw') {
    const rawPayload = {
      collection: colName,
      date: mySaleDaySelectedDate,
      systemCode: systemCode,
      ipAddress: systemIP || '127-0-0-1',
      summary: { totalSales: totalRev, cash: cashRev, upi: upiRev, card: cardRev, count: daySales.length },
      catalog: { categoriesCount: (S.cats||[]).length, productsCount: (S.products||[]).length },
      sales: daySales
    };
    return `
      <div class="card">
        <h3 style="margin:0 0 8px">🔍 All Data JSON View (Firestore Payload)</h3>
        <p class="mu" style="margin-top:0">Ye exact JSON structure aapke Firestore collection <code>${esc(colName)}</code> me documents ke roop me save hota hai:</p>
        <pre style="background:#0f172a;color:#38bdf8;padding:14px;border-radius:10px;overflow:auto;max-height:450px;font-size:12px;font-family:monospace">${esc(JSON.stringify(rawPayload, null, 2))}</pre>
      </div>
    `;
  }

  return '';
}

/* ══════════════════════════════════════════════════════════════════
   STAFF & DUTIES MANAGEMENT (Cook, Waiter, Manager, Cashier, etc.)
   & WAITER DIRECT ORDER TERMINAL
   ══════════════════════════════════════════════════════════════════ */

let staffFilterDuty = 'All';
let staffSearchQuery = '';

function initStaffState() {
  if (!S.staff || !Array.isArray(S.staff)) {
    S.staff = [];
    return;
  }
  // Automatically remove any sample/demo data if previously created
  const beforeLen = S.staff.length;
  S.staff = S.staff.filter(s => s && s.id !== 'st_1' && s.id !== 'st_2' && s.id !== 'st_3' && s.employeeId !== 'waiter-rahul' && s.employeeId !== 'cook-amit' && s.employeeId !== 'waiter-priya');
  if (S.staff.length !== beforeLen) {
    save();
  }
}

function setStaffFilter(duty) {
  staffFilterDuty = duty;
  vStaff();
}

function setStaffSearch(val) {
  staffSearchQuery = (val || '').toLowerCase().trim();
  vStaff();
}

function vStaff() {
  initStaffState();
  const fpId = getUniqueMerchantId();
  const baseUrl = getStoreMenuBaseUrl();
  const allStaff = S.staff || [];

  // Metrics
  const totalCount = allStaff.length;
  const waiterCount = allStaff.filter(s => (s.duty || '').toLowerCase() === 'waiter').length;
  const cookCount = allStaff.filter(s => {
    const d = (s.duty || '').toLowerCase();
    return d.includes('cook') || d.includes('chef') || d.includes('kitchen');
  }).length;
  const otherCount = totalCount - waiterCount - cookCount;

  // Filtered List
  const filtered = allStaff.filter(s => {
    if (staffFilterDuty !== 'All') {
      if (staffFilterDuty === 'Waiter' && (s.duty || '').toLowerCase() !== 'waiter') return false;
      if (staffFilterDuty === 'Cook' && !(s.duty || '').toLowerCase().includes('cook') && !(s.duty || '').toLowerCase().includes('chef')) return false;
      if (staffFilterDuty === 'Cashier' && !(s.duty || '').toLowerCase().includes('cashier')) return false;
      if (staffFilterDuty === 'Manager' && !(s.duty || '').toLowerCase().includes('manager')) return false;
    }
    if (staffSearchQuery) {
      const matchName = (s.name || '').toLowerCase().includes(staffSearchQuery);
      const matchId = (s.employeeId || '').toLowerCase().includes(staffSearchQuery);
      const matchPhone = (s.phone || '').toLowerCase().includes(staffSearchQuery);
      const matchDuty = (s.duty || '').toLowerCase().includes(staffSearchQuery);
      if (!matchName && !matchId && !matchPhone && !matchDuty) return false;
    }
    return true;
  });

  const app = $('#app');
  if (!app) return;

  app.innerHTML = `
    <div style="max-width:1200px;margin:0 auto;padding-bottom:50px">
      <!-- Header Banner -->
      <div class="card" style="margin-bottom:16px;background:linear-gradient(135deg, #0f172a 0%, #1e293b 100%);color:#fff;border-radius:16px;padding:22px 24px">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px">
          <div>
            <div style="display:flex;align-items:center;gap:10px">
              <span style="font-size:26px">👥</span>
              <h2 style="margin:0;font-size:22px;font-weight:900;letter-spacing:-0.5px">Staff &amp; Duty Management</h2>
              <span style="background:rgba(234,88,12,0.25);border:1px solid #ea580c;color:#fdba74;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px">Waiter Terminal Active</span>
            </div>
            <p style="margin:6px 0 0;color:#94a3b8;font-size:13.5px;max-width:650px">
              Employees ko add karein, unki duties assign karein (Cook, Waiter, Cashier, Manager). Waiters ke liye unique IDs aur direct ordering links generate hote hain jisse wo table orders punch kar sakein.
            </p>
          </div>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <button class="p" onclick="openStaffModal()" style="background:#ea580c;border-color:#ea580c;font-weight:800;font-size:13.5px;padding:10px 18px;border-radius:10px;display:inline-flex;align-items:center;gap:7px;box-shadow:0 4px 14px rgba(234,88,12,0.4);cursor:pointer">
              <span>➕ Add Employee</span>
            </button>
            <button onclick="syncStaffToCloud(true)" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;font-weight:700;font-size:13px;padding:10px 15px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px">
              <span>🔄 Sync Cloud</span>
            </button>
          </div>
        </div>

        <!-- Metrics Row -->
        <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.1)">
          <div style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px">
            <div style="font-size:12px;color:#94a3b8;font-weight:700">TOTAL EMPLOYEES</div>
            <div style="font-size:24px;font-weight:900;color:#fff;margin-top:4px">${totalCount}</div>
          </div>
          <div style="background:rgba(234,88,12,0.15);border:1px solid rgba(234,88,12,0.3);border-radius:12px;padding:12px 16px">
            <div style="font-size:12px;color:#fdba74;font-weight:700">🤵 ACTIVE WAITERS</div>
            <div style="font-size:24px;font-weight:900;color:#ffedd5;margin-top:4px">${waiterCount} <span style="font-size:12px;font-weight:600;color:#fdba74">(With Direct Links)</span></div>
          </div>
          <div style="background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.25);border-radius:12px;padding:12px 16px">
            <div style="font-size:12px;color:#6ee7b7;font-weight:700">👨‍🍳 KITCHEN / COOKS</div>
            <div style="font-size:24px;font-weight:900;color:#ecfdf5;margin-top:4px">${cookCount}</div>
          </div>
          <div style="background:rgba(147,197,253,0.12);border:1px solid rgba(147,197,253,0.25);border-radius:12px;padding:12px 16px">
            <div style="font-size:12px;color:#93c5fd;font-weight:700">💼 CASHIERS / MANAGERS</div>
            <div style="font-size:24px;font-weight:900;color:#eff6ff;margin-top:4px">${otherCount}</div>
          </div>
        </div>
      </div>

      <!-- Controls & Filter Bar -->
      <div class="card" style="margin-bottom:16px;padding:14px 18px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${[
            { key: 'All', label: 'All Staff (' + totalCount + ')' },
            { key: 'Waiter', label: '🤵 Waiters (' + waiterCount + ')' },
            { key: 'Cook', label: '👨‍🍳 Cooks (' + cookCount + ')' },
            { key: 'Cashier', label: '💵 Cashier' },
            { key: 'Manager', label: '👔 Managers' }
          ].map(f => `
            <button onclick="setStaffFilter('${f.key}')" style="padding:7px 14px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:1.5px solid ${staffFilterDuty === f.key ? '#ea580c' : '#e2e8f0'};background:${staffFilterDuty === f.key ? '#fff4ed' : '#fff'};color:${staffFilterDuty === f.key ? '#ea580c' : '#475569'}">
              ${f.label}
            </button>
          `).join('')}
        </div>
        <div style="display:flex;align-items:center;gap:8px">

        </div>
      </div>

      <!-- Employee Cards Grid -->
      ${filtered.length === 0 ? `
        <div class="card" style="text-align:center;padding:50px 20px;border-radius:16px">
          <div style="font-size:48px;margin-bottom:12px">👥</div>
          <h3 style="margin:0 0 8px;color:#1e293b">Koi Employee Nahi Mila</h3>
          <p class="mu" style="margin:0 0 18px">Naya employee add karne ke liye "+ Add Employee" button par click karein.</p>
          <button class="p" onclick="openStaffModal()">+ Add New Employee</button>

      ` : `
        <div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(360px, 1fr));gap:16px">

            const isWaiter = (emp.duty || '').toLowerCase() === 'waiter';
            const isCook = (emp.duty || '').toLowerCase().includes('cook') || (emp.duty || '').toLowerCase().includes('chef');
            const waiterUrl = `${baseUrl}/menu/${encodeURIComponent(fpId)}/waiter/${encodeURIComponent(emp.employeeId)}`;
            const dutyColor = isWaiter ? '#ea580c' : (isCook ? '#059669' : '#4f46e5');
            const dutyBg = isWaiter ? '#fff4ed' : (isCook ? '#ecfdf5' : '#eef2ff');
            const dutyIcon = isWaiter ? '🤵' : (isCook ? '👨‍🍳' : (emp.duty === 'Manager' ? '👔' : '💼'));

                      <div style="font-size:11.5px;color:#78350f;background:#fff;padding:6px 8px;border-radius:6px;border:1px solid #fed7aa;word-break:break-all;font-family:monospace;margin-bottom:8px">

function onStaffNameChange() {
  const name = ($('#staffName')?.value || '').trim();
  const duty = $('#staffDuty')?.value || 'Waiter';
  const empIdInput = $('#staffEmpId');
  if (empIdInput && empIdInput.dataset.manual !== 'true') {
    const slugName = name.toLowerCase().replace(/[^a-z0-9]/g, '');
    const slugDuty = (duty === 'Other' ? ($('#staffCustomDuty')?.value || 'staff') : duty).toLowerCase().slice(0, 6);
    if (slugName) {
      empIdInput.value = `${slugDuty}-${slugName}`;
    } else {
      empIdInput.value = `${slugDuty}-emp`;
    }
    updateWaiterUrlPreview();
  }
}

function onStaffDutyChange() {
  const duty = $('#staffDuty')?.value;
  const customWrap = $('#customDutyWrap');
  if (customWrap) {
    customWrap.style.display = (duty === 'Other') ? 'block' : 'none';
  }
  const empIdInput = $('#staffEmpId');
  if (empIdInput && empIdInput.dataset.manual !== 'true') {
    onStaffNameChange();
  } else {
    updateWaiterUrlPreview();
  }
}

function updateWaiterUrlPreview() {
  const fpId = getUniqueMerchantId();
  const empId = $('#staffEmpId')?.value || 'waiter-id';
  const preview = $('#waiterUrlPreview');
  if (preview) {
    preview.innerHTML = `Ordering Link: domain/${esc(fpId)}/waiter/<b>${esc(empId)}</b>`;
  }
}

function saveStaffMember() {
  const editId = $('#staffEditId')?.value;
  const name = ($('#staffName')?.value || '').trim();
  let duty = $('#staffDuty')?.value || 'Waiter';
  if (duty === 'Other') {
    duty = ($('#staffCustomDuty')?.value || '').trim() || 'Staff';
  }
  let empId = ($('#staffEmpId')?.value || '').trim().toLowerCase().replace(/[^a-z0-9_-]/g, '-');
  const phone = ($('#staffPhone')?.value || '').trim();
  const pin = ($('#staffPin')?.value || '').trim() || '1234';
  const notes = ($('#staffNotes')?.value || '').trim();

  if (!name) {
    alert('Please enter employee name.');
    return;
  }
  if (!empId) {
    empId = (duty.toLowerCase().slice(0, 6)) + '-' + name.toLowerCase().replace(/[^a-z0-9]/g, '');
  }

  // Ensure unique employeeId
  const allStaff = S.staff || [];
  const duplicate = allStaff.find(s => s.employeeId === empId && s.id !== editId);
  if (duplicate) {
    alert('Employee ID "' + empId + '" already exists! Please choose a unique ID.');
    return;
  }

  if (editId) {
    const idx = allStaff.findIndex(s => s.id === editId);
    if (idx !== -1) {
      allStaff[idx] = {
        ...allStaff[idx],
        name,
        duty,
        employeeId: empId,
        phone,
        pin,
        notes
      };
    }
  } else {
    allStaff.push({
      id: 'st_' + Date.now(),
      employeeId: empId,
      name,
      duty,
      phone,
      pin,
      status: 'Active',
      assignedTables: [],
      notes
    });
  }

  S.staff = allStaff;
  save();
  closeM();
  vStaff();
  syncStaffToCloud(false);
}

function deleteStaffMember(id) {
  const emp = (S.staff || []).find(s => s.id === id);
  if (!emp) return;
  if (!confirm(`Are you sure you want to remove employee "${emp.name}" (${emp.duty})?`)) return;
  S.staff = (S.staff || []).filter(s => s.id !== id);
  save();
  vStaff();
  syncStaffToCloud(false);
}

function toggleStaffStatus(id) {
  const emp = (S.staff || []).find(s => s.id === id);
  if (!emp) return;
  emp.status = (emp.status === 'Inactive') ? 'Active' : 'Inactive';
  save();
  vStaff();
  syncStaffToCloud(false);
}

function copyWaiterLink(url) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(() => {
      alert('✅ Waiter ordering link copied to clipboard!\n\n' + url + '\n\nShare this link with your waiter to take orders directly.');
    }).catch(() => {
      prompt('Copy this Waiter link:', url);
    });
  } else {
    prompt('Copy this Waiter link:', url);
  }
}

          setTimeout(() => { window.print(); window.close(); }, 400);

async function loadStaffFromCloud() {
  try {
    const fpId = getUniqueMerchantId();
    const baseUrl = getStoreMenuBaseUrl();
    const res = await fetch(`${baseUrl}/api/staff?foodypayId=${encodeURIComponent(fpId)}`);
    const json = await res.json();
    if (json.success && Array.isArray(json.data) && json.data.length > 0) {
      const map = new Map();
      (S.staff || []).forEach(s => {
        if (s && s.employeeId) map.set(s.employeeId, s);
      });
      json.data.forEach(s => {
        if (s && s.employeeId && !map.has(s.employeeId)) {
          map.set(s.employeeId, {
            id: s._id || uid(),
            employeeId: s.employeeId,
            name: s.name,
            duty: s.duty,
            phone: s.phone || '',
            pin: s.pin || '1234',
            status: s.status || 'Active',
            assignedTables: s.assignedTables || [],
            notes: s.notes || ''
          });
        }
      });
      S.staff = Array.from(map.values());
      save();
      if (typeof tab !== 'undefined' && tab === 'staff' && typeof vStaff === 'function') {
        vStaff();
      }
    }
  } catch (err) {}
}
